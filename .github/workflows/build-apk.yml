name: Compilar APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Tests y APK debug
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Nombrar APK como SuplementosTime_Vx
        id: ver
        run: |
          N=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/SuplementosTime_V${N}.apk"
          echo "name=SuplementosTime_V${N}" >> "$GITHUB_OUTPUT"
      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
